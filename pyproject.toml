[project]
name = "paper-knowledge-base"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mjalon03", email = "alon96835@naver.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.28.2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires configured local GROBID and Docling environments",
    "metadata_integration: calls public Crossref and OpenAlex APIs",
]
